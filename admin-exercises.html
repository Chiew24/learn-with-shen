<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Question Bank | Learn with Shen</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/typography.css"><link rel="stylesheet" href="assets/css/logo.css"><link rel="stylesheet" href="assets/css/header.css"><link rel="stylesheet" href="assets/css/admin.css"></head>
<body class="admin-page"><header class="site-header"><a class="logo" href="index.html"><img src="assets/images/logo.png" alt="Learn with Shen logo"><span class="logo-wordmark">Learn with <strong>Shen</strong></span></a><nav class="nav"><a href="admin-dashboard.html">Dashboard</a><button id="logout-button" class="admin-logout" type="button">Logout</button></nav></header>
<main class="admin-main"><div class="admin-heading"><div><p class="admin-eyebrow">CONTENT MANAGEMENT</p><h1>Manage Question Bank</h1><p>Manage the questions that appear in your student Question Bank.</p></div><button id="new-exercise-button" class="login-button" type="button">+ Add Question</button></div>
<section id="exercise-form-panel" class="admin-panel" hidden><h2 id="form-title">Add Question</h2><form id="exercise-form"><input type="hidden" id="exercise-id"><label for="topic-id">Topic</label><select id="topic-id" required></select><label for="exercise-title">Title</label><input id="exercise-title" placeholder="e.g. Question 1"><label for="question">Question</label><textarea id="question" rows="6" required placeholder="Enter the question..."></textarea><label for="answer">Answer</label><textarea id="answer" rows="3" placeholder="Enter the answer..."></textarea><label for="solution">Solution</label><textarea id="solution" rows="6" placeholder="Enter the solution..."></textarea><label for="difficulty">Difficulty</label><select id="difficulty"><option value="">Not specified</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><label for="marks">Marks</label><input id="marks" type="number" min="1" placeholder="e.g. 5"><label><input id="exercise-published" type="checkbox"> Published</label><div><button class="login-button" type="submit">Save Question</button> <button id="cancel-button" type="button">Cancel</button></div><p id="form-message" role="alert"></p></form></section>
<section class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Question</th><th>Topic</th><th>Difficulty</th><th>Status</th><th>Actions</th></tr></thead><tbody id="exercises-body"><tr><td colspan="5">Loading...</td></tr></tbody></table></div></section><p id="admin-message" class="admin-message" role="alert"></p></main>
<script type="module" src="assets/js/admin-exercises.js"></script></body></html>
