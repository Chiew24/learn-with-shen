<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Add a question to the Learn with Shen question bank."><title>Add Question | Learn with Shen</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/typography.css"><link rel="stylesheet" href="../assets/css/logo.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/admin.css">
<style>.add-question-page{max-width:900px}.add-question-panel{margin-top:28px}.question-form{display:grid;gap:18px}.question-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question-form label{display:grid;gap:8px;font-weight:700}.question-form input,.question-form textarea,.question-form select{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d9cfbd;border-radius:10px;background:#fffdf8;font:inherit;color:#302c27}.question-form textarea{min-height:110px;resize:vertical}.question-form .full{grid-column:1/-1}.question-form-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.question-form button{border:1px solid #6e5b43;border-radius:10px;padding:11px 18px;background:#6e5b43;color:#fffdf8;font:inherit;font-weight:700;cursor:pointer}.question-form button:disabled{opacity:.6;cursor:not-allowed}.publish-option{display:flex!important;align-items:center;grid-template-columns:auto 1fr;gap:9px!important}.publish-option input{width:auto}.form-message{margin:0;font-weight:600}.back-link{display:inline-block;margin-top:20px;color:#6e5b43;font-weight:700;text-decoration:none}@media(max-width:700px){.question-form-grid{grid-template-columns:1fr}.question-form .full{grid-column:auto}}</style>
</head>
<body class="admin-page">
<header class="site-header"><a class="logo" href="index.html"><img src="../assets/images/logo.png" alt="Learn with Shen logo"><span class="logo-wordmark">Learn with <strong>Shen</strong></span></a><button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="nav"><a href="index.html">Dashboard</a><a href="question-bank.html">Question Bank</a><button id="logout-button" class="admin-logout" type="button">Logout</button></nav></header>
<main class="admin-main add-question-page"><div class="admin-heading"><div><p class="admin-eyebrow">CONTENT MANAGEMENT</p><h1>Add Question</h1><p>Create a new question for the question bank.</p></div></div>
<section class="admin-panel add-question-panel"><form id="question-form" class="question-form"><div class="question-form-grid">
<label class="full">Question<textarea id="question-input" required placeholder="Enter the question"></textarea></label>
<label>Chapter<select id="chapter-input" required><option value="">Loading chapters...</option></select></label>
<label>Difficulty<select id="difficulty-input"><option value="easy">easy</option><option value="medium">medium</option><option value="hard">hard</option></select></label>
<label>Question Number<input id="display-order-input" type="number" min="1" step="1" placeholder="e.g. 1"></label>
<label>Marks<input id="marks-input" type="number" min="0" step="1" placeholder="e.g. 5"></label>
<label class="full">Hint<textarea id="hint-input" placeholder="Optional hint shown when the user clicks Hint"></textarea></label>
<label class="full">Answer<textarea id="answer-input" placeholder="Enter the answer"></textarea></label>
<label class="full">Step-by-Step Solution<textarea id="solution-input" placeholder="Enter the step-by-step solution"></textarea></label>
</div><div class="question-form-actions"><label class="publish-option"><input id="publish-input" type="checkbox"> Publish immediately</label><button id="add-question-button" type="submit">Add Question</button><p id="question-form-message" class="form-message" role="status" aria-live="polite"></p></div></form></section><a class="back-link" href="question-bank.html">← Back to Question Bank</a></main>
<script type="module" src="../assets/js/admin.js"></script><script src="../assets/js/script.js"></script>
</body></html>
