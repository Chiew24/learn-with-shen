<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Add a question to the Learn with Shen question bank."><title>Add Question | Learn with Shen</title>
<link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/typography.css"><link rel="stylesheet" href="../assets/css/logo.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/admin.css">
<script src="https://unpkg.com/mathlive" defer></script>
<style>.add-question-page{max-width:900px}.add-question-panel{margin-top:28px}.question-form{display:grid;gap:18px}.question-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.question-form label{display:grid;gap:8px;font-weight:700}.question-form input,.question-form textarea,.question-form select{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d9cfbd;border-radius:10px;background:#fffdf8;font:inherit;color:#302c27}.question-form textarea{min-height:110px;resize:vertical}.question-form .full{grid-column:1/-1}.question-field{display:grid;gap:8px}.question-field-label{font-weight:700}.equation-actions{display:flex;gap:8px;align-items:center;margin-top:2px}.equation-button{border:1px solid #d9cfbd;border-radius:8px;padding:7px 11px;background:#f6f0e5;color:#6e5b43;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.equation-button:hover{background:#eee6d7}.question-form-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.question-form button{border:1px solid #6e5b43;border-radius:10px;padding:11px 18px;background:#6e5b43;color:#fffdf8;font:inherit;font-weight:700;cursor:pointer}.question-form button:disabled{opacity:.6;cursor:not-allowed}.publish-option{display:flex!important;align-items:center;grid-template-columns:auto 1fr;gap:9px!important}.publish-option input{width:auto}.form-message{margin:0;font-weight:600}.back-link{display:inline-block;margin-top:20px;color:#6e5b43;font-weight:700;text-decoration:none}.equation-modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;background:rgba(48,44,39,.35);padding:20px}.equation-modal.is-open{display:flex}.equation-dialog{width:min(620px,100%);background:#fffdf8;border:1px solid #d9cfbd;border-radius:16px;padding:24px;box-shadow:0 18px 50px rgba(48,44,39,.18)}.equation-dialog h2{margin:0 0 8px;font-size:20px}.equation-dialog p{margin:0 0 16px;color:#6e5b43}.equation-input{display:block;width:100%;box-sizing:border-box;font-size:28px;padding:14px;border:1px solid #d9cfbd;border-radius:10px;background:#fff}.equation-preview{min-height:30px;margin:16px 0;padding:12px;border-radius:8px;background:#f7f2e9;font-size:18px}.equation-dialog-actions{display:flex;justify-content:flex-end;gap:10px}.equation-dialog-actions button{border:1px solid #6e5b43;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}.equation-cancel{background:#fffdf8;color:#6e5b43}.equation-insert{background:#6e5b43;color:#fffdf8}@media(max-width:700px){.question-form-grid{grid-template-columns:1fr}.question-form .full{grid-column:auto}.equation-dialog{padding:18px}.equation-input{font-size:24px}}</style>
</head>
<body class="admin-page">
<header class="site-header"><a class="logo" href="index.html"><img src="../assets/images/logo.png" alt="Learn with Shen logo"><span class="logo-wordmark">Learn with <strong>Shen</strong></span></a><button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="nav"><a href="index.html">Dashboard</a><a href="question-bank.html">Question Bank</a><button id="logout-button" class="admin-logout" type="button">Logout</button></nav></header>
<main class="admin-main add-question-page"><div class="admin-heading"><div><p class="admin-eyebrow">CONTENT MANAGEMENT</p><h1>Add Question</h1><p>Create a new question for the question bank.</p></div></div>
<section class="admin-panel add-question-panel"><form id="question-form" class="question-form"><div class="question-form-grid">
<div class="question-field full"><span class="question-field-label">Question</span><textarea id="question-input" required placeholder="Enter the question"></textarea><div class="equation-actions"><button type="button" class="equation-button" data-equation-target="question-input">∑ Equation</button></div></div>
<label>Chapter<select id="chapter-input" required><option value="">Loading chapters...</option></select></label>
<label>Difficulty<select id="difficulty-input"><option value="easy">easy</option><option value="medium">medium</option><option value="hard">hard</option></select></label>
<div class="question-field full"><span class="question-field-label">Hint</span><textarea id="hint-input" placeholder="Optional hint shown when the user clicks Hint"></textarea><div class="equation-actions"><button type="button" class="equation-button" data-equation-target="hint-input">∑ Equation</button></div></div>
<div class="question-field full"><span class="question-field-label">Answer</span><textarea id="answer-input" placeholder="Enter the answer"></textarea><div class="equation-actions"><button type="button" class="equation-button" data-equation-target="answer-input">∑ Equation</button></div></div>
<div class="question-field full"><span class="question-field-label">Step-by-Step Solution</span><textarea id="solution-input" placeholder="Enter the step-by-step solution"></textarea><div class="equation-actions"><button type="button" class="equation-button" data-equation-target="solution-input">∑ Equation</button></div></div>
</div><div class="question-form-actions"><label class="publish-option"><input id="publish-input" type="checkbox"> Publish immediately</label><button id="add-question-button" type="submit">Add Question</button><p id="question-form-message" class="form-message" role="status" aria-live="polite"></p></div></form></section><a class="back-link" href="question-bank.html">← Back to Question Bank</a></main>
<div id="equation-modal" class="equation-modal" aria-hidden="true"><div class="equation-dialog" role="dialog" aria-modal="true" aria-labelledby="equation-title"><h2 id="equation-title">Insert Equation</h2><p>Type your equation using the math keyboard, then insert it into the text.</p><math-field id="equation-input" class="equation-input" virtual-keyboard-mode="onfocus"></math-field><div id="equation-preview" class="equation-preview"></div><div class="equation-dialog-actions"><button type="button" class="equation-cancel" id="equation-cancel">Cancel</button><button type="button" class="equation-insert" id="equation-insert">Insert Equation</button></div></div></div>
<script type="module" src="../assets/js/admin.js"></script><script src="../assets/js/script.js"></script>
</body></html>
