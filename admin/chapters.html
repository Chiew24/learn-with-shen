<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manage Chapters | Learn with Shen</title><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/typography.css"><link rel="stylesheet" href="../assets/css/logo.css"><link rel="stylesheet" href="../assets/css/header.css"><link rel="stylesheet" href="../assets/css/admin.css"></head>
<body class="admin-page"><header class="site-header"><a class="logo" href="../index.html"><img src="../assets/images/logo.png" alt="Learn with Shen logo"><span class="logo-wordmark">Learn with <strong>Shen</strong></span></a><nav class="nav"><a href="index.html">Dashboard</a><a href="notes.html">Notes</a><a href="question-bank.html">Question Bank</a><button id="logout-button" class="admin-logout" type="button">Logout</button></nav></header>
<main class="admin-main"><div class="admin-heading"><div><p class="admin-eyebrow">CONTENT MANAGEMENT</p><h1>Manage Chapters</h1><p>View and manage your Form 4 and Form 5 chapters.</p></div></div><section class="admin-panel"><div class="table-wrap"><table><thead><tr><th>Form</th><th>Chapter</th><th>Title</th><th>Status</th></tr></thead><tbody id="chapters-body"><tr><td colspan="4">Loading...</td></tr></tbody></table></div></section></main>
<script type="module">
import { supabase } from '../assets/js/supabase.js';
const body=document.querySelector('#chapters-body');
async function init(){const {data:{user}}=await supabase.auth.getUser();if(!user){location.href='../login.html';return;}const {data:profile}=await supabase.from('profiles').select('role').eq('id',user.id).single();if(!profile||profile.role!=='admin'){location.href='../login.html';return;}const {data,error}=await supabase.from('chapters').select('form,chapter_number,title,is_published').order('form').order('display_order');if(error){body.innerHTML='<tr><td colspan="4">'+error.message+'</td></tr>';return;}if(!data?.length){body.innerHTML='<tr><td colspan="4">No chapters yet.</td></tr>';return;}body.innerHTML=data.map(c=>`<tr><td>Form ${c.form}</td><td>Chapter ${c.chapter_number}</td><td>${c.title}</td><td>${c.is_published?'Published':'Draft'}</td></tr>`).join('');}
document.querySelector('#logout-button').addEventListener('click',async()=>{await supabase.auth.signOut();location.href='../login.html';});init();
</script></body></html>
