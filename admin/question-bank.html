<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Manage the Learn with Shen question bank.">
<title>Question Bank | Learn with Shen</title>
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/typography.css">
<link rel="stylesheet" href="../assets/css/logo.css">
<link rel="stylesheet" href="../assets/css/header.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
.question-bank-actions{display:flex;justify-content:flex-end;margin-bottom:20px}.add-question-link{display:inline-flex;align-items:center;text-decoration:none;border:1px solid #6e5b43;border-radius:10px;padding:11px 18px;background:#6e5b43;color:#fffdf8;font-weight:700}.question-bank-question{max-width:360px}.question-bank-answer,.question-bank-solution{max-width:260px}
</style>
</head>
<body class="admin-page">
<header class="site-header">
  <a class="logo" href="index.html"><img src="../assets/images/logo.png" alt="Learn with Shen logo"><span class="logo-wordmark">Learn with <strong>Shen</strong></span></a>
  <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
  <nav class="nav"><a href="index.html">Dashboard</a><button id="logout-button" class="admin-logout" type="button">Logout</button></nav>
</header>
<main class="admin-main">
  <div class="admin-heading"><div><p class="admin-eyebrow">LEARN WITH SHEN</p><h1>Question Bank</h1><p>Manage your questions, answers and solutions.</p></div></div>
  <div class="question-bank-actions"><a href="add-question.html" class="add-question-link">+ Add Question</a></div>
  <section class="question-bank-table-wrap" aria-label="Question Bank">
    <table class="question-bank-table">
      <thead><tr><th scope="col">Question Number</th><th scope="col">Question</th><th scope="col">Difficulty</th><th scope="col">Answer</th><th scope="col">Solution</th></tr></thead>
      <tbody id="question-bank-body"><tr><td colspan="5" class="question-bank-empty">Loading questions...</td></tr></tbody>
    </table>
  </section>
  <p id="admin-message" class="admin-message" role="alert" aria-live="polite"></p>
</main>
<script type="module" src="../assets/js/admin.js"></script>
<script src="../assets/js/script.js"></script>
</body>
</html>
