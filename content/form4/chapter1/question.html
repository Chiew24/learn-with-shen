<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question | Learn with Shen</title>
<link rel="stylesheet" href="../../../assets/css/style.css">
<link rel="stylesheet" href="../../../assets/css/header.css">
<link rel="stylesheet" href="../../../assets/css/footer.css">
<style>
.question-page{padding:70px 0 90px}.question-head{max-width:1020px;margin:0 0 42px}.question-head .eyebrow{margin:0 0 24px;font-size:32px;font-weight:700;color:#6e5b43;letter-spacing:2px}.question-meta{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0}.question-number{font-size:20px;font-weight:700;letter-spacing:.7px;color:#38332d}.difficulty-pill{display:inline-block;font-size:20px;font-weight:700;letter-spacing:.5px;padding:7px 12px;border-radius:999px;background:#eee6d7;color:#6e5b43}.question-detail{max-width:1020px}.detail-card{background:#fffdf8;border:1px solid #ded5c5;border-radius:16px;padding:28px;margin-bottom:20px}.detail-label{font-size:16px;font-weight:800;letter-spacing:1.5px;color:#6e5b43;margin-bottom:16px}.detail-text{font-size:16px;white-space:pre-wrap;line-height:1.8;margin:0;color:#38332d}.answer-card,.hint-card{padding:0;overflow:hidden}.answer-toggle,.hint-toggle{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0;padding:28px;font-size:16px;font-weight:800;letter-spacing:1.5px;color:#6e5b43}.answer-toggle::-webkit-details-marker,.hint-toggle::-webkit-details-marker{display:none}.answer-toggle::after,.hint-toggle::after{content:'▾';font-size:22px;font-weight:400;color:#6e5b43}.answer-card[open] .answer-toggle::after,.hint-card[open] .hint-toggle::after{content:'▴'}.answer-content,.hint-content{padding:0 28px 28px}.solution-card{border-left:4px solid #ded5c5}.solution-card .detail-label{margin-bottom:16px}@media(max-width:700px){.question-page{padding:55px 0 70px}.question-head{margin-bottom:32px}.question-head .eyebrow{font-size:26px}.question-number,.difficulty-pill{font-size:18px}.detail-card{padding:22px}.answer-card,.hint-card{padding:0}.answer-toggle,.hint-toggle{padding:22px}.answer-content,.hint-content{padding:0 22px 22px}}
</style>
</head>
<body>
<header class="navbar"><div class="container nav"><a class="logo" href="../../../index.html">Learn with <span>Shen</span></a><button class="menu" id="menu">☰</button><nav id="nav"><a href="../../../index.html">Home</a><div class="drop"><a href="#">Learn <span>▾</span></a><div><a href="../../../form4.html">Form 4</a><a href="../../../form5.html">Form 5</a></div></div><a class="active" href="../../../question-bank.html">Question Bank</a><a href="../../../about.html">About</a></nav></div></header>
<main><section class="question-page"><div class="container"><div id="question-root"><div class="empty">Loading question...</div></div></div></section></main>
<footer><div class="container foot"><div><h3>Learn with Shen</h3><p>SPM Additional Mathematics learning platform.</p></div><div class="flinks"><a href="../../../index.html">Home</a><a href="../../../form4.html">Form 4</a><a href="../../../form5.html">Form 5</a><a href="../../../question-bank.html">Question Bank</a><a href="../../../about.html">About</a></div></div><div class="copy">© 2026 Learn with Shen. All rights reserved.</div></footer>
<script type="module">
import { supabase } from '../../../assets/js/supabase.js';
const root=document.querySelector('#question-root');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){
 const id=new URLSearchParams(location.search).get('id');
 if(!id){root.innerHTML='<div class="empty">Question not found.</div>';return;}
 const {data:q,error}=await supabase.from('exercises').select('id,question,answer,solution,difficulty,marks,is_published,topic_id,created_at').eq('id',id).eq('is_published',true).single();
 if(error||!q){root.innerHTML='<div class="empty">Question not found or is not available.</div>';return;}
 const {data:chapter,error:ce}=await supabase.from('chapters').select('id').eq('form',4).eq('chapter_number',1).single();
 let questionNumber='Question';
 if(!ce&&chapter){
   const {data:topics}=await supabase.from('topics').select('id').eq('chapter_id',chapter.id);
   const topicIds=(topics||[]).map(t=>t.id);
   if(topicIds.length){
     const {data:allQuestions}=await supabase.from('exercises').select('id,created_at').eq('is_published',true).in('topic_id',topicIds).order('created_at');
     const index=(allQuestions||[]).findIndex(item=>String(item.id)===String(q.id));
     if(index>=0) questionNumber=`Question ${index+1}`;
   }
 }
 root.innerHTML=`<div class="question-head"><p class="eyebrow">FORM 4 · CHAPTER 1</p><div class="question-meta"><span class="question-number">${questionNumber}</span>${q.difficulty?`<span class="difficulty-pill">${esc(q.difficulty)}</span>`:''}</div></div><div class="question-detail"><section class="detail-card"><div class="detail-label">QUESTION</div><p class="detail-text">${esc(q.question)}</p></section>${q.answer?`<details class="detail-card answer-card"><summary class="answer-toggle">ANSWER</summary><div class="answer-content"><p class="detail-text">${esc(q.answer)}</p></div></details>`:''}${q.solution?`<section class="detail-card solution-card"><div class="detail-label">STEP-BY-STEP SOLUTION</div><p class="detail-text">${esc(q.solution)}</p></section>`:''}</div>`;
}
load();
</script>
<script src="../../../assets/js/script.js"></script>
</body>
</html>
