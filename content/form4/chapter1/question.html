<script type="module">import { supabase } from '../../../assets/js/supabase.js';const root=document.querySelector('#question-root');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){root.innerHTML='<div class="empty">Question not found.</div>';return;}const {data:q,error}=await supabase.from('exercises').select('id,question,answer,solution,hint,difficulty,marks,is_published,chapter_id,display_order').eq('id',id).eq('is_published',true).single();if(error||!q){root.innerHTML='<div class="empty">Question not found or is not available.</div>';return;}const {data:chapter}=await supabase.from('chapters').select('form,chapter_number,title').eq('id',q.chapter_id).single();const chapterText=chapter?`FORM ${chapter.form} · CHAPTER ${chapter.chapter_number}`:'QUESTION';const questionNumber=q.display_order||'Question';root.innerHTML=`<div class="question-head"><p class="eyebrow">${esc(chapterText)}</p><div class="question-meta"><span class="question-number">${typeof questionNumber==='number'?`Question ${questionNumber}`:esc(questionNumber)}</span>${q.difficulty?`<span class="difficulty-pill">${esc(q.difficulty)}</span>`:''}</div></div><div class="question-detail"><section class="detail-card"><div class="detail-label">QUESTION</div><p class="detail-text">${esc(q.question)}</p></section>${q.hint?`<details class="detail-card hint-card"><summary class="hint-toggle">HINT</summary><div class="hint-content"><p class="detail-text">${esc(q.hint)}</p></div></details>`:''}${q.answer?`<details class="detail-card answer-card"><summary class="answer-toggle">ANSWER</summary><div class="answer-content"><p class="detail-text">${esc(q.answer)}</p></div></details>`:''}${q.solution?`<section class="detail-card solution-card"><div class="detail-label">STEP-BY-STEP SOLUTION</div><p class="detail-text">${esc(q.solution)}</p></section>`:''}</div>`;}load();</script><script src="../../../assets/js/script.js"></script></body></html>
